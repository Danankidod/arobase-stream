name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  validate:
    name: validate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate mediamtx.yml is valid YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; yaml.safe_load(open('mediamtx.yml')); print('mediamtx.yml OK')"

      - name: Shellcheck start.sh (errors only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error start.sh

      - name: Validate nginx.conf syntax
        run: |
          docker run --rm -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:alpine nginx -t

      - name: Guard against hardcoded secrets
        run: |
          if grep -RInE "x-stream-secret:[[:space:]]*[A-Za-z0-9_]+" mediamtx.yml; then
            echo "::error::Hardcoded stream webhook secret in mediamtx.yml — use \$STREAM_WEBHOOK_SECRET"
            exit 1
          fi
          # The publisher password must stay a placeholder (start.sh injects the
          # real one at boot from STREAM_PUBLISH_PASSWORD).
          if ! grep -q "pass: __STREAM_PUBLISH_PASSWORD__" mediamtx.yml; then
            echo "::error::publisher pass placeholder missing/changed — never commit a real RTMP password"
            exit 1
          fi
          echo "No hardcoded secrets — OK"
