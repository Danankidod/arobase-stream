name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  validate:
    name: validate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate mediamtx.yml is valid YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; yaml.safe_load(open('mediamtx.yml')); print('mediamtx.yml OK')"

      - name: Shellcheck start.sh (errors only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error start.sh notify.sh

      - name: Validate nginx.conf syntax
        run: |
          docker run --rm -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:alpine nginx -t

      - name: Guard against hardcoded secrets
        run: |
          if grep -RInE "x-stream-secret:[[:space:]]*[A-Za-z0-9_]+" mediamtx.yml notify.sh; then
            echo "::error::Hardcoded stream webhook secret in mediamtx.yml — use \$STREAM_WEBHOOK_SECRET"
            exit 1
          fi
          # The publisher password must stay a placeholder (start.sh injects the
          # real one at boot from STREAM_PUBLISH_PASSWORD).
          if ! grep -q "pass: __STREAM_PUBLISH_PASSWORD__" mediamtx.yml; then
            echo "::error::publisher pass placeholder missing/changed — never commit a real RTMP password"
            exit 1
          fi
          echo "No hardcoded secrets — OK"

      - name: Per-brand publishers generated by start.sh (alpine, busybox)
        run: |
          # Same vector as arobase-live server/lib/stream-credentials.test.ts
          docker run --rm -v "$PWD:/w:ro" alpine:3.20 sh -euc '
            apk add -q --no-cache openssl >/dev/null
            mkdir -p /tmp/bin && printf "#!/bin/sh\nexit 0\n" > /tmp/bin/nginx && cp /tmp/bin/nginx /tmp/bin/mediamtx && chmod +x /tmp/bin/*
            STREAM_PUBLISH_MASTER=lab-master-0123 STREAM_PUBLISH_KEYS=brand-a,brand-b \
              MEDIAMTX_CONFIG=/w/mediamtx.yml RUNTIME_CONFIG=/tmp/rt.yml PATH=/tmp/bin:$PATH sh /w/start.sh
            grep -q "pass: sha256:k7Q5a/gvIxtexCrGRPhp8pKpg9hpcOaHmo155kRfTDw=" /tmp/rt.yml
            test "$(grep -c "action: publish" /tmp/rt.yml)" -eq 6
            ! grep -q "__BRAND_PUBLISHERS__\|__STREAM_PUBLISH_PASSWORD__\|lab-master-0123" /tmp/rt.yml
            echo "per-brand publishers OK"'

      - name: B9 — /replay errors do not leak disk paths (red on the frozen pre-B9 config, green here)
        run: |
          # test/nginx.before-b9.conf = nginx.conf at f88d060, the last commit before
          # the B9 fix. Frozen on purpose: comparing against main stops proving
          # anything once the fix is merged (main then no longer leaks).
          sh test/replay-errors.sh test/nginx.before-b9.conf expect-leak
          sh test/replay-errors.sh nginx.conf expect-clean

      - name: R2 — nginx never serves hidden paths (red on frozen pre-R2 config, green here)
        run: |
          sh test/hidden-paths.sh test/nginx.before-r2.conf expect-leak
          sh test/hidden-paths.sh nginx.conf expect-clean

      - name: R2 — start.sh TLS logic (no network, fake acme.sh)
        run: docker run --rm -v "$PWD:/w:ro" alpine:3.20 sh /w/test/tls-start.sh

      - name: A4 — volume over 80 % evicts oldest files below 60 %, .tls untouched (red on frozen pre-A4 start.sh, green here)
        run: |
          # test/start.before-a4.sh = start.sh at 09860cf (find -printf, absent from busybox).
          docker run --rm -v "$PWD:/w:ro" alpine:3.20 sh /w/test/volume-evict.sh /w/test/start.before-a4.sh expect-stuck
          docker run --rm -v "$PWD:/w:ro" alpine:3.20 sh /w/test/volume-evict.sh /w/start.sh expect-evict

      - name: A4b — cleanup also runs periodically, no restart needed (red on frozen pre-A4b start.sh, green here)
        run: |
          # test/start.before-a4b.sh = start.sh at 4df1549 (cleanup on boot only).
          docker run --rm -v "$PWD:/w:ro" alpine:3.20 sh /w/test/volume-periodic.sh /w/test/start.before-a4b.sh expect-stuck
          docker run --rm -v "$PWD:/w:ro" alpine:3.20 sh /w/test/volume-periodic.sh /w/start.sh expect-evict
          # Boot-time eviction (A4) still green with the refactor.
          docker run --rm -v "$PWD:/w:ro" alpine:3.20 sh /w/test/volume-evict.sh /w/start.sh expect-evict

      - name: R2 — acme.sh package exists on alpine 3.20
        run: docker run --rm alpine:3.20 sh -c 'apk add -q --no-cache acme.sh >/dev/null && acme.sh --version | head -2'

      - name: R2 — official MediaMTX 1.19.1 starts in no and optional, RTMP + RTMPS accepted
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          sh test/mediamtx-rtmps.sh
